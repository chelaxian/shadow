name: build

on:
  push:
    branches: [ratu-dopamine]
  workflow_dispatch:

# One run per ref: a new push cancels the superseded in-progress run, and
# PR branches don't double-run against their push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: /opt/theos
  # HookKit is consumed from the Theos install, not vendored. CI provisions the
  # pinned commit per lane (tools/release/install-theos.sh <lane> in the HookKit repo)
  # before building Shadow; local devs manage their own Theos HookKit.
  HOOKKIT: d1770553fed455d7868a78d2fa7dfc5734ed0cf9

jobs:
  modern:
    name: ${{ matrix.flavor }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [rootless]
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        run: |
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/jjolano/theos.git "$THEOS"
          # Xcode 16's iOS SDK dropped private-framework tbds (Preferences et
          # al); stage the pinned 16.5 SDK so dependency framework links
          # (AltList -> Preferences) resolve.
          curl -fL -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          echo '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  '"$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | shasum -a 256 -c -
          sudo mkdir -p "$THEOS/sdks"
          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"

          # The detector-harness runners pin the 14.5 SDK (see their TARGET
          # lines and the FreeRASP compat-framework symlinks). jjolano/theos
          # carries it in provision.lock, so fetch it the same way the legacy
          # job does (URL+sha pinned there, not here).
          curl -fL -o "$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz
          echo '1c998a5ee7eb8c29e39f0d8c83add9cad1a954342ca0d86204d1b4fe08a921b9  '"$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" | shasum -a 256 -c -
          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" -C "$THEOS/sdks"

          # install-hookkit-theos.sh writes the HookKit framework into $THEOS/lib;
          # the tree was cloned with sudo, so hand it to the runner user.
          sudo chown -R "$(id -un)" "$THEOS"

      - name: Build and verify
        env:
          # HookKit ABI drift is a review gate, not noise: a HookKit update
          # that adds/removes/renames ABI surface Shadow binds to must fail
          # loudly so it gets adapted, not shipped around silently.
          SHADOW_HOOKKIT_ABI_STRICT: 1
        run: |
          .github/scripts/install-hookkit-theos.sh "${{ matrix.flavor }}"
          .github/scripts/build-deps.sh "${{ matrix.flavor }}"
          ./build.sh "${{ matrix.flavor }}"

      - uses: actions/upload-artifact@v6
        with:
          name: shadow-${{ matrix.flavor }}
          path: build/*.deb
